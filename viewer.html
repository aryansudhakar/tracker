<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{ --bg:#f5f6fa; --card:#ffffff; --text:#1c1e21; --sub:#6b7280; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111317; --card:#1b1e24; --text:#f3f4f6; --sub:#9ca3af; --border:#2a2d34; }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{ background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #map{ position:fixed; inset:0; top:76px; }
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:1000;
    padding:14px 18px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:var(--card); border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center;
  }
  .topbar h1{ font-size:16px; margin:0; }
  .meta{ font-size:12px; color:var(--sub); }
  .badge{ font-size:11px; padding:4px 9px; border-radius:999px; background:#16a34a22; color:#16a34a; font-weight:600; }
  .badge.stale{ background:#dc262622; color:#dc2626; }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>Phone Location</h1>
      <div class="meta" id="meta">Loading…</div>
    </div>
    <div class="badge" id="badge">—</div>
  </div>
  <div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const FIREBASE_DB_URL = "https://tracker-app-14b27-default-rtdb.firebaseio.com";
const DEVICE_PATH = "oppo-reno14";

const map = L.map('map').setView([0,0], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
}).addTo(map);

let marker = null, circle = null, first = true;
const metaEl = document.getElementById('meta');
const badgeEl = document.getElementById('badge');

async function refresh(){
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${DEVICE_PATH}.json`);
    const data = await res.json();
    if(!data){ metaEl.textContent = 'No location reported yet'; return; }
    const { lat, lng, accuracy, ts } = data;
    const ageSec = (Date.now() - ts) / 1000;

    if(!marker){
      marker = L.marker([lat,lng]).addTo(map);
      circle = L.circle([lat,lng], { radius: accuracy || 20, color:'#2563eb', fillOpacity:0.15 }).addTo(map);
    } else {
      marker.setLatLng([lat,lng]);
      circle.setLatLng([lat,lng]).setRadius(accuracy || 20);
    }
    if(first){ map.setView([lat,lng], 16); first = false; }

    metaEl.textContent = `Updated ${Math.round(ageSec)}s ago · ±${Math.round(accuracy||0)}m`;
    if(ageSec < 60){ badgeEl.textContent = 'Live'; badgeEl.classList.remove('stale'); }
    else { badgeEl.textContent = 'Stale'; badgeEl.classList.add('stale'); }
  } catch(e){
    metaEl.textContent = 'Could not reach server';
  }
}

refresh();
setInterval(refresh, 8000);
</script>
</body>
</html>
